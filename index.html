<script>
        // HIER DEINE RENDER-URL MIT HTTPS:// EINTRAGEN
        const BACKEND_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:5000"
            : "https://kizzyyyyyy-github-io.onrender.com"; // <-- Ersetze diesen Link mit deiner Render-URL!

        const myToken = localStorage.getItem('chat_token') || 'token_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_token', myToken);

        let activeFriend = null;

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const chosenId = document.getElementById('userIdInput').value.trim();
            const statusDiv = document.getElementById('loginStatus');

            if (!/^\d{12}$/.test(chosenId)) {
                statusDiv.innerText = "Fehler: ID muss exakt 12 Zahlen lang sein.";
                statusDiv.style.color = "var(--danger)";
                return;
            }

            statusDiv.innerText = "Registrierung läuft...";
            statusDiv.style.color = "var(--text-muted)";

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: myToken, chosenId: chosenId })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appShell').style.display = 'block';
                    document.getElementById('myIdDisplay').innerText = chosenId;
                    
                    startDashboardPolling();
                } else {
                    statusDiv.innerText = data.message || "Registrierung fehlgeschlagen.";
                    statusDiv.style.color = "var(--danger)";
                }
            } catch (err) {
                statusDiv.innerText = "Fehler: Server reagiert nicht. Läuft das Backend?";
                statusDiv.style.color = "var(--danger)";
            }
        });

        document.getElementById('addFriendBtn').addEventListener('click', async () => {
            const friendId = document.getElementById('friendIdInput').value.trim();
            const statusDiv = document.getElementById('friendAddStatus');

            try {
                const res = await fetch(`${BACKEND_URL}/api/friends/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: myToken, friendName: friendId })
                });
                const data = await res.json();
                statusDiv.innerText = data.message;
                statusDiv.style.color = res.ok ? "var(--accent-mint)" : "var(--danger)";
                document.getElementById('friendIdInput').value = '';
                updateDashboard();
            } catch (e) {
                statusDiv.innerText = "Fehler beim Hinzufügen.";
            }
        });

        async function updateDashboard() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/dashboard?token=${myToken}`);
                if (!res.ok) return;
                const data = await res.json();
                
                const listDiv = document.getElementById('friendList');
                if (data.friends.length === 0) {
                    listDiv.innerHTML = '<div class="empty-friends">Noch keine Freunde verbunden.</div>';
                    return;
                }

                listDiv.innerHTML = '';
                data.friends.forEach(fId => {
                    const row = document.createElement('div');
                    row.className = `friend-row ${activeFriend === fId ? 'active' : ''}`;
                    row.innerHTML = `
                        <div class="avatar" style="background:var(--accent-cyan)">${fId.substr(0,2)}</div>
                        <div class="friend-meta">
                            <div class="fid">${fId}</div>
                            <div class="fstatus" style="color:var(--accent-mint)">Verbunden</div>
                        </div>
                    `;
                    row.onclick = () => selectFriend(fId);
                    listDiv.appendChild(row);
                });
            } catch (e) { console.error("Dashboard-Fehler", e); }
        }

        function selectFriend(fId) {
            activeFriend = fId;
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('activeFriendId').innerText = fId;
            updateDashboard();
            loadMessages();
        }

        async function loadMessages() {
            if (!activeFriend) return;
            try {
                const res = await fetch(`${BACKEND_URL}/api/messages?token=${myToken}&friend=${activeFriend}`);
                const messages = await res.json();
                const chatBox = document.getElementById('chatBox');
                
                const wasAtBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;

                chatBox.innerHTML = '';
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `msg ${msg.fromMe ? 'me' : ''}`;
                    div.innerText = msg.text;
                    chatBox.appendChild(div);
                });

                if (wasAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) { console.error(e); }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !activeFriend) return;

            try {
                const res = await fetch(`${BACKEND_URL}/api/messages/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: myToken, toFriend: activeFriend, text: text })
                });
                if (res.ok) {
                    input.value = '';
                    loadMessages();
                }
            } catch (e) { console.error(e); }
        }

        function startDashboardPolling() {
            updateDashboard();
            setInterval(() => {
                updateDashboard();
                loadMessages();
            }, 3000);
        }
    </script>
